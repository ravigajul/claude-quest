<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Oswald:wght@600;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone-first single column. Each world has its own skin. Base is The Heist: noir black, alarm red, vault gold. */
  --bg:#0b0b0d;
  --card:#17171b;
  --ink:#f2efe8;
  --muted:#a8a29a;
  --line:#2e2b30;
  --accent:#e0312f;
  --accent-ink:#ffffff;
  --star:#e8b54a;
  --good:#5fd18f;
  --bad:#ff5a52;
  --claude:#221c20;
  --display:"Oswald","Bricolage Grotesque",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:16px 16px 64px;display:grid;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:700}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.muted{color:var(--muted);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.office{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dept{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;text-align:center;font-size:10.5px;padding:3px;line-height:1.15;color:var(--muted);background:var(--bg)}
.dept.lit{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.dept.now{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
.levels{display:grid;gap:8px}
.lvl{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.lvl:disabled{opacity:.5;cursor:not-allowed}
.lvl .num{font-family:var(--display);font-weight:800;font-size:20px;width:30px;text-align:center}
.lvl .t{flex:1;min-width:0}
.lvl .t b{display:block}
.lvl .t span{font-size:13px;color:var(--muted)}
.stars{color:var(--star,#f5c542);letter-spacing:2px;font-size:18px;white-space:nowrap;text-shadow:0 0 1px var(--accent-ink)}
.stars .off{color:var(--line);text-shadow:none}
.bubble{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg)}
.avatar.claude{background:#7b5cd6;color:#fff}
.msg{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;flex:1;min-width:0}
.msg.claude{background:var(--claude);white-space:pre-wrap}
.msg small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.enemy{display:flex;gap:10px;align-items:center}
.monster{width:40px;height:40px;border-radius:46% 54% 42% 58%;position:relative;flex:0 0 40px}
.monster::before,.monster::after{content:"";position:absolute;top:13px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:inset 3px 2px 0 #16203a}
.monster::before{left:9px}.monster::after{right:9px}
.monster.locked{background:var(--line)!important}
.monster.locked::before,.monster.locked::after{display:none}
.slot{display:grid;gap:6px}
.slot>label{font-weight:700;font-size:14px}
.opts{display:grid;gap:6px}
.opt{text-align:left;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.opt.flag[aria-pressed="true"]{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--ink);border-color:var(--bad)}
.preview{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;min-height:44px}
.btn{font-family:var(--display);font-weight:800;font-size:17px;border:none;border-radius:12px;padding:13px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:48px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.link{background:none;border:none;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px}
.why{display:grid;gap:8px}
.why .w{border-left:4px solid var(--line);padding:2px 0 2px 10px}
.why .w.best{border-color:var(--good)}
.why .w.meh{border-color:var(--accent)}
.why .w.bad{border-color:var(--bad)}
.why .w b{display:block;font-size:14px}
.why .w span{font-size:14px;color:var(--muted)}
.til{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;display:grid;gap:4px}
.til h3{color:var(--accent-ink)}
.loot{display:flex;gap:8px;flex-wrap:wrap}
.tcard{border:1.5px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--card);font-size:14px;display:grid;gap:2px;min-width:0}
.tcard b{font-family:var(--display)}
.tcard.locked{border-style:dashed;border-color:var(--line);color:var(--muted)}
.tcard.mastered{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.tcard[aria-pressed]{cursor:pointer;text-align:left;font:inherit;font-size:14px;color:var(--ink)}
.tcard[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{display:grid;gap:8px}
.ab .p{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:15px}
.ab .p b{font-family:var(--display)}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.tline{display:flex;gap:10px;text-align:left;width:100%;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
.tline .n{color:var(--muted);font-variant-numeric:tabular-nums;min-width:18px}
.tline[aria-pressed="true"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.tline.hit{border-color:var(--good)}
.tline.miss{border-style:dashed;border-color:var(--bad)}
.hp{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s}
.share{font-family:ui-monospace,Menlo,monospace;font-size:13px;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;border:1px solid var(--line)}
.foot{font-size:12px;color:var(--muted);text-align:center}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.hp i{transition:none}}

/* ---------- motion layer ---------- */
#app>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(6){animation-delay:.2s}#app>*:nth-child(7){animation-delay:.24s}#app>*:nth-child(n+8){animation-delay:.28s}
@keyframes rise{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
.tcard,.lvl,.opt,.tline{transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease,box-shadow .2s ease,translate .2s ease}
.lvl:not(:disabled):hover,.tcard[aria-pressed]:hover{box-shadow:0 10px 22px -12px rgba(22,32,58,.45)}
.opt[aria-pressed="true"],.tcard[aria-pressed="true"]{translate:0 -3px;box-shadow:0 8px 0 -3px var(--ink)}
.btn{transition:translate .15s,box-shadow .15s;box-shadow:0 4px 0 0 var(--btn-shadow,#7a1414)}
.btn:not(:disabled):active{translate:0 3px;box-shadow:0 1px 0 0 var(--btn-shadow,#7a1414)}
.btn.alt{box-shadow:0 4px 0 0 var(--line)}
.monster{animation:bob 2.4s ease-in-out infinite}
.monster::before,.monster::after{animation:blink 4.2s infinite}
.monster .m{position:absolute;left:50%;bottom:8px;width:12px;height:5px;margin-left:-6px;border-radius:0 0 8px 8px;background:#16203a}
.monster.big{width:84px;height:84px;flex-basis:84px}
.monster.big::before,.monster.big::after{top:24px;width:17px;height:17px;box-shadow:inset 5px 4px 0 #16203a}
.monster.big::before{left:17px}.monster.big::after{right:17px}
.monster.big .m{width:26px;height:10px;margin-left:-13px;bottom:17px}
@keyframes bob{50%{translate:0 -5px;scale:1.04 .96}}
@keyframes blink{0%,93%,100%{scale:1 1}96%{scale:1 .1}}
.monster.hit{animation:hit .45s}
.monster.defeated{animation:poof 1s .3s forwards}
.monster.taunt{animation:taunt .7s ease-in-out 3}
@keyframes hit{15%{translate:-7px 0;filter:brightness(2)}35%{translate:7px 0}55%{translate:-5px 0}75%{translate:3px 0}}
@keyframes poof{30%{scale:1.25;rotate:-12deg}100%{scale:.1;rotate:260deg;opacity:0}}
@keyframes taunt{25%{translate:0 -12px}50%{translate:0 0}75%{translate:0 -6px}}
.shake{animation:hit .45s}
.stars.anim span:not(.off){display:inline-block;animation:starpop .55s both}
.stars.anim span:nth-child(2){animation-delay:.25s}.stars.anim span:nth-child(3){animation-delay:.5s}
@keyframes starpop{0%{scale:0;rotate:-120deg}70%{scale:1.5}100%{scale:1}}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{translate:0 -5px;opacity:.4}}
.float{position:fixed;font-family:var(--display);font-weight:800;font-size:30px;color:var(--bad);pointer-events:none;z-index:30;animation:floatup .9s forwards;text-shadow:0 2px 0 var(--card)}
.float.good{color:var(--good)}
@keyframes floatup{to{translate:0 -70px;opacity:0}}
.flycard{position:fixed;z-index:25;pointer-events:none;margin:0;transition:transform .45s cubic-bezier(.5,0,.8,.4),opacity .45s}
.tower{width:100%;max-width:420px;display:block;margin:0 auto}
.bigfoe{display:flex;gap:14px;align-items:center}
@media (prefers-reduced-motion:reduce){#app>*,.monster,.monster::before,.monster::after,.stars.anim span,.dots span{animation:none!important}.tcard,.lvl,.opt,.tline{transition:none}}
.cork{position:relative;border-radius:12px;padding:18px 12px 14px;background:#6a4e34 radial-gradient(circle at 20% 30%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/14px 14px;border:7px solid #3a281a;box-shadow:inset 0 0 30px rgba(0,0,0,.45)}
.cork svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cork .pols{position:relative;display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center}
.pol{width:92px;background:#f4efe4;color:#1b1b1b;padding:7px 7px 9px;border-radius:2px;box-shadow:0 6px 12px rgba(0,0,0,.45);rotate:var(--r,0deg);position:relative;text-align:center;font-size:12px;line-height:1.2}
.pol::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#d2353b;box-shadow:0 2px 2px rgba(0,0,0,.5);z-index:2}
.pol .ph{aspect-ratio:1;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:34px;margin-bottom:5px;background:#3a4157;color:#cfd5e6}
.pol.lit .ph{background:var(--accent);color:var(--accent-ink)}
.pol.now .ph{background:#2c3550;color:#f5c542}
.pol.mys .ph{background:#1f2433;color:#59607a}
.pol b{display:block;font-size:13px}
.pol .stamp{position:absolute;top:34%;left:4px;right:4px;border:2px solid #c2272d;color:#c2272d;font-weight:800;font-size:10px;letter-spacing:.06em;rotate:-14deg;background:rgba(244,239,228,.7);padding:1px 0}
.cork path{stroke:#d2353b;stroke-width:2;fill:none;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.cork path{animation:none;stroke-dashoffset:0}}
[data-skin="office"]{--bg:#f3f6fb;--card:#ffffff;--ink:#14213d;--muted:#5b6785;--line:#d9e0ec;--accent:#2f6bff;--accent-ink:#ffffff;--star:#f2b705;--good:#14876a;--bad:#d8343b;--claude:#eef2ff;--btn-shadow:#1c3f99;--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;color-scheme:light}
.worlds{display:grid;gap:12px}
.world{display:grid;gap:8px;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer}
.world .art{height:110px;position:relative;overflow:hidden}
.world .txt{padding:4px 14px 14px;display:grid;gap:4px}
.world .txt b{font-family:var(--display);font-size:20px}
.wo-office .art{background:linear-gradient(#cfe3ff,#eef4ff)}
.wo-office .art i{position:absolute;bottom:0;width:46px;background:#16203a;border-radius:3px 3px 0 0;background-image:linear-gradient(90deg,transparent 6px,#ffd23f 6px 14px,transparent 14px 20px,#ffd23f 20px 28px,transparent 28px 34px,#ffd23f 34px 40px,transparent 40px);background-size:100% 16px}
.wo-heist .art{background:#6a4e34 radial-gradient(circle at 20% 30%,rgba(255,255,255,.07) 0 2px,transparent 3px) 0 0/14px 14px}
.wo-heist .art span{position:absolute;top:22px;width:54px;height:66px;background:#f4efe4;box-shadow:0 4px 8px rgba(0,0,0,.4);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#2a1f00;font-size:22px}
.wo-heist .art svg{position:absolute;inset:0}
[data-skin="wizard"]{--bg:#160f2e;--card:#24194a;--ink:#f3eeff;--muted:#b1a6dc;--line:#3a2d6b;--accent:#7ff0d0;--accent-ink:#062a20;--star:#ffd86b;--good:#7ff0d0;--bad:#ff86a8;--claude:#2f2160;--btn-shadow:#2f8a72;--display:"Cinzel",Georgia,serif;color-scheme:dark}
[data-skin="wizard"] body{background:radial-gradient(ellipse at 50% -10%,#3a2380,#160f2e 55%) fixed}
[data-skin="heist"] body,html:not([data-skin]) body{background:radial-gradient(ellipse at 50% -15%,#2c2226,#0b0b0d 55%) fixed}
[data-skin="heist"] h1,[data-skin="heist"] h2{text-transform:uppercase;letter-spacing:.03em}
[data-skin="wizard"] h1,[data-skin="wizard"] h2{letter-spacing:.02em}
[data-skin="office"] .card{box-shadow:0 1px 3px rgba(20,33,61,.06)}
.wo-wizard .art{background:radial-gradient(circle at 70% 30%,#5b3fa8,#140f29 70%)}
.wo-wizard .art b{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #8be9d0}
.sky{width:100%;max-width:420px;display:block;margin:0 auto}
[data-skin="picker"]{--bg:#101318;--card:#1a1e26;--ink:#f2f4f8;--muted:#a3abbd;--line:#2c3240;--accent:#ffffff;--accent-ink:#101318;--display:"Bricolage Grotesque",sans-serif;color-scheme:dark}
[data-skin="picker"] body{background:#101318}
.worlds .world{width:100%;display:flex;flex-direction:column;gap:0;border-width:2px;transition:translate .2s,box-shadow .2s}
.worlds .world:hover{translate:0 -3px}
.world .art{height:120px;width:100%}
.world .txt{padding:14px 16px 16px;display:grid;gap:6px;justify-items:start}
.world .txt b{font-family:var(--display);font-size:22px;line-height:1.15}
.world .go{display:inline-block;margin-top:4px;padding:7px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.wo-office{--accent:#2f6bff;--accent-ink:#fff;--muted:#5b6785;--display:"Bricolage Grotesque",sans-serif;background:#ffffff;color:#14213d;border-color:#2f6bff}
.wo-heist{--accent:#e0312f;--accent-ink:#fff;--muted:#a8a29a;--display:"Oswald",sans-serif;background:#17171b;color:#f2efe8;border-color:#e0312f}
.wo-heist .txt b{text-transform:uppercase;letter-spacing:.03em}
.wo-wizard{--accent:#7ff0d0;--accent-ink:#062a20;--muted:#b1a6dc;--display:"Cinzel",Georgia,serif;background:#24194a;color:#f3eeff;border-color:#7ff0d0}
.world .txt .muted{color:var(--muted)}
.split{display:grid;gap:14px;grid-template-areas:"board" "play" "extra"}
.col{display:grid;gap:14px;align-content:start;min-width:0}
@media (min-width:900px){
  #app{max-width:780px;padding-top:28px}
  #app.wide{max-width:1180px;padding-left:32px;padding-right:32px}
  .split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"board play" "extra play";column-gap:28px}
  .worlds{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
  .worlds .world{height:100%}
  .world .art{height:240px}
  #app.picker{min-height:100vh;align-content:center;gap:22px}
  .world .txt{padding:20px 22px 22px}
  .world .txt b{font-size:26px}
  .world .txt .muted{font-size:16px}
  .tower,.sky{max-width:560px}
  #app.wide .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
  h1{font-size:34px}
}
/* world color everywhere */
h3{color:var(--accent)}
[data-skin="office"] h3{color:#2f6bff}
.card{border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
.lvl{border-left:5px solid var(--accent)}
.lvl:disabled{border-left-color:var(--line)}
.lvl .num{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:18px}
.lvl:disabled .num{background:var(--line);color:var(--muted)}
.avatar{background:var(--accent);color:var(--accent-ink)}
.hero{border:none;color:#fff}
.hero h3,.hero h1{color:#fff}
.hero .muted{color:rgba(255,255,255,.82)}
.hero .pill,.hero .tab{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.hero .tab[aria-current="true"]{background:#fff;color:#111;border-color:#fff}
[data-skin="office"] .hero{background:linear-gradient(120deg,#1f4fd6,#2f6bff 55%,#6b9bff)}
[data-skin="heist"] .hero,html:not([data-skin]) .hero{background:linear-gradient(120deg,#b81f1d,#5a0e0e 55%,#17171b);box-shadow:inset 0 -3px 0 #e8b54a}
[data-skin="wizard"] .hero{background:linear-gradient(120deg,#5b3fc4,#2f1f6e 55%,#1d4f4a);box-shadow:inset 0 -3px 0 #7ff0d0}
[data-skin="wizard"] .hero h1{color:#7ff0d0}
[data-skin="heist"] .hero h1{color:#ffffff;text-shadow:0 2px 0 #000}
.why .w.best{border-color:var(--accent)}
#sig{text-align:center;padding:6px 16px 22px;font-size:12.5px;letter-spacing:.02em}
#sig a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--muted)}
#sig a:hover{color:var(--accent);border-color:var(--accent)}
#pz{position:fixed;top:12px;right:12px;z-index:50;font-family:var(--display);font-weight:800;font-size:14px;padding:9px 14px;border-radius:999px;border:2px solid var(--accent);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.bp-title{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;color:#8fb8ff;font-size:13px;border-bottom:1px dashed #3d6fb0;padding-bottom:8px}

/* BOSS */
function boss(L){

  clear();intro(L).forEach(function(x){add(app,x);});
  var have=Object.keys(S.cards).filter(function(c){return CARDS[c];});
  app.append(h("div",{class:"card"},h("p",null,L.scout)));
  var chosen=[];var go=h("button",{class:"btn",type:"button",disabled:true},"Start the boss");
  var cnt=h("p",{class:"muted"},"Pick 4 cards. 0 of 4 picked.");
  var grid=h("div",{class:"grid2"});
  have.forEach(function(id){grid.append(h("button",{class:"tcard",type:"button","aria-pressed":"false",onclick:function(e){var i=chosen.indexOf(id);if(i>=0)chosen.splice(i,1);else if(chosen.length<4)chosen.push(id);e.currentTarget.setAttribute("aria-pressed",chosen.indexOf(id)>=0?"true":"false");cnt.textContent="Pick 4 cards. "+chosen.length+" of 4 picked.";go.disabled=chosen.length!==4;}},h("b",null,CARDS[id].n),h("span",null,CARDS[id].d)));});

  app.append(h("h3",null,"Your loadout"),grid,cnt,go);
  go.addEventListener("click",function(){fight(L,chosen.slice());});
}
function fight(L,hand,P){
  var w=P?P.w:0,score=P?P.score:0,hp=P?P.hp:100;var plays=P?P.plays.map(function(p){return{id:p[0],q:p[1],w:L.waves[p[2]]};}):[];
  function wave(){
    clear();var W=L.waves[w];checkpoint(L,{w:w,score:score,hp:hp,hand:hand.slice(),plays:plays.map(function(p){return[p.id,p.q,L.waves.indexOf(p.w)];})});
    if(P&&w===P.w)app.append(resumedNote(P));
    app.append(h("div",null,h("h3",null,"Level "+L.id+" · Wave "+(w+1)),h("h2",null,W.label)));
    var bar=h("div",{class:"hp"},h("i",{style:"width:"+hp+"%"}));var real=!!ENEMIES[W.foe];if(real){S.met[W.foe]=true;save();}
    var mon=monsterEl(real?W.foe:null,true,real?null:"#7b5cd6");
    app.append(h("div",{class:"card"},h("div",{class:"bigfoe"},mon,h("div",null,h("h2",null,real?ENEMIES[W.foe].name:"Curveball"),h("div",{class:"muted"},"Boss health"))),bar));
    app.append(clientBubble(L,W.msg));
    app.append(h("h3",null,"Play a card"));
    var grid=h("div",{class:"grid2"});
    hand.forEach(function(id){grid.append(h("button",{class:"tcard",type:"button","aria-pressed":"false",onclick:function(e){play(id,e.currentTarget);}},h("b",null,CARDS[id].n),h("span",null,CARDS[id].d)));});
    app.append(grid);
    function play(id,cardEl){
      grid.style.pointerEvents="none";
      hand.splice(hand.indexOf(id),1);
      var q=W.strong.indexOf(id)>=0?3:W.ok.indexOf(id)>=0?1:0;score+=q;plays.push({id:id,q:q,w:W});
      hp=Math.max(0,hp-(q===3?25:q===1?10:0));
      if(reduce||!cardEl||!cardEl.getBoundingClientRect)return show();
      var r1=cardEl.getBoundingClientRect(),r2=mon.getBoundingClientRect();
      var fly=cardEl.cloneNode(true);fly.classList.add("flycard");fly.style.left=r1.left+"px";fly.style.top=r1.top+"px";fly.style.width=r1.width+"px";
      document.body.append(fly);cardEl.style.visibility="hidden";
      requestAnimationFrame(function(){requestAnimationFrame(function(){
        fly.style.transform="translate("+(r2.left+r2.width/2-r1.left-r1.width/2)+"px,"+(r2.top+r2.height/2-r1.top-r1.height/2)+"px) rotate(25deg) scale(.25)";fly.style.opacity=".7";});});
      setTimeout(function(){fly.remove();
        if(q>0){mon.classList.remove("taunt");void mon.offsetWidth;mon.classList.add("hit");sfx("hit");buzz(q===3?80:30);}else{mon.classList.add("taunt");sfx("bad");}
        floatText(q===3?"-25":q===1?"-10":"Miss",mon,q===0);bar.firstChild.style.width=hp+"%";
        setTimeout(show,750);},460);
    }
    function show(){var id=plays[plays.length-1].id,q=plays[plays.length-1].q;
      clear();
      app.append(h("div",null,h("h3",null,"Wave "+(w+1)),h("h2",null,q===3?"Direct hit":q===1?"Glancing blow":"Miss")));
      app.append(h("div",{class:"card pop"},h("div",{class:"hp"},h("i",{style:"width:"+hp+"%"})),
        h("p",null,h("b",null,CARDS[id].n+": "),(W.why[id]||"This card doesn't counter "+W.label+".")),
        q<3?h("p",{class:"muted"},"Best counter: "+W.strong.map(function(s){return CARDS[s].n;}).join(" or ")):null));
      app.append(h("button",{class:"btn",type:"button",onclick:function(){w++;if(w<L.waves.length)wave();else end();}},w<L.waves.length-1?"Next wave":"See what happened"));
    }
  }
  function end(){
    clear();var n=score>=12?3:score>=9?2:score>=5?1:0;
    var mast=[];if(n>=1)plays.forEach(function(p){if(p.q===3&&S.cards[p.id]!=="mastered"){S.cards[p.id]="mastered";mast.push(p.id);}});save();
    app.append(h("div",null,h("h3",null,"Level "+L.id+" · Results"),h("h2",null,L.title)));
    var el=h("div",{style:"display:grid;gap:14px"});app.append(el);
    var rows=plays.map(function(p){return h("div",{class:"w "+(p.q===3?"best":p.q===1?"meh":"bad")},h("b",null,p.w.label+": "+CARDS[p.id].n),h("span",null,p.w.why[p.id]||"This card doesn't counter it."));});
    var det=h("div",{class:"why"},h("p",null,"Score "+score+" of 12."),rows,

      n>=1?h("div",{class:"card"},h("h3",null,THEMES[S.theme].endTitle),h("p",null,THEMES[S.theme].endText),h("p",{class:"muted"},"And Dana has one more thing for you.")):null);
    finish(L,n,el,det,n===0?"Brought a role card to a word-count fight.":null);

if(S.theme&&THEMES[S.theme]){applyTheme();home();}else{S.theme="heist";applyTheme();S.theme=null;themePicker();}
